[project]
name = "image-analyzer"
version = "0.1.0"
description = "Smart image filtering, deduplication and clustering for product catalogues"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tomáš Maxim" }]
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/FETKlOkAn2/Image-Analyzer"
Issues = "https://github.com/FETKlOkAn2/Image-Analyzer/issues"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "venv",
    ".venv",
    "image_analysis_results",
    "metrics",
    "final_images",
]

[tool.ruff.lint]
# The blocking set enforced in CI: syntax errors, undefined names, broken
# comparisons. The wider set (E, W, I, UP, B) is reported non-blocking while the
# prototype's existing lint debt is worked down — see the `lint-report` CI job.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"simple_analyzer.py" = ["T201"]
"image_analyzer.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
